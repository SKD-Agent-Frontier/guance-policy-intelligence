[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guance-agent"
version = "0.1.0"
description = "政策原文检索命令行助手"
requires-python = ">=3.11"
dependencies = ["openai-agents>=0.24,<0.25", "openai", "pydantic>=2", "python-dotenv"]

[project.optional-dependencies]
dev = ["ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guance_agent = ["prompts/*.md"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
