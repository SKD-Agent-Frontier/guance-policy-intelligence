[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guance-rag"
version = "0.4.0"
description = "管策智研只读检索运行时与同步知识库接口"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "bm25s==0.3.15", "jieba==0.42.1", "qdrant-client==1.15.1", "filelock>=3", "numpy>=2", "httpx>=0.28", "transformers>=4.57,<5", "pillow>=11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
guance-rag = "guance_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
