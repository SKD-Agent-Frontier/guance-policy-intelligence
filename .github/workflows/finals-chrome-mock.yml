name: Finals Chrome Mock E2E

on:
  push:
    branches: [finals/integration]
    paths:
      - "web/frontend/**"
      - ".github/workflows/finals-chrome-mock.yml"
  pull_request:
    paths:
      - "web/frontend/**"
      - ".github/workflows/finals-chrome-mock.yml"

permissions:
  contents: read

jobs:
  chrome-mock-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify system Chrome
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Run mock browser tests with system Chrome
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: npm run test:e2e:mock
      # Repeat the three verification commands after Chrome, not concurrently
      # with the browser on the same runner (the previous local run was flaky).
      - name: Run Vitest separately after Chrome
        run: npm test
      - name: Typecheck separately after Vitest
        run: npm run typecheck
      - name: Build separately after typecheck
        run: npm run build
      - name: Upload mock Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-mock-traces
          path: web/frontend/test-results-mock/
          retention-days: 3
