name: One-time cleanup of verified merged legacy branches

on:
  push:
    branches:
      - experiment/hyperresearch-mechanisms
    paths:
      - .github/workflows/cleanup-merged-branches-once.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete only pinned verified merged legacy branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, urllib.parse
          expected = {"codex/qa-quality-optimization-20261105":"7e51ab27e3aa4adb3d3916283739d4738c6cc192","feat/agent-decision-convergence-v2":"7109bfd741705bdbf2596f756fd5388568944d2f","feat/agent-intent-research-delivery":"1bc1cd96bafedcd3eb0773cd6bfe345f33af2110","feat/business-contract":"6a603ee52acc72484bc8b62beda5017fec44d0cb","feat/business-integration":"166592efa6dccf35838d28136069f8e3e277103d","feat/catalog-policytype-dropdown-20261031":"cb951004b28524bc948892b98fc70b75a2150f37","feat/conversation-clean-results-source-reader-20261031":"356f3934a99610f6f510195edb9129d3753fc160","feat/guance-official-brand-20261031":"3e3b91ecfa2524a23033595a66687524cd03ab94","feat/natural-language-research-modes":"4ff086bfadc7150fb74958d6647ca4d354537ea8","feat/organize-module":"42bf05bbde93b52cfbe76cb766ef5b4bb1f9b4b7","feat/policy-catalog-search":"70d4e09b7a9ec7e8ba5fc3c4f53c2a217e0a268f","feat/policy-facets-backend":"2ca6674c2b434d061da5673701c9e514b93d9622","feat/policy-facets-implementation":"83a78710ec31870df7e37d4479ee502b7e4feb7c","feat/policy-facets-ui":"275f6890a6afb31ae1a838db9c75e735266b3702","feat/qa-evidence-linked-analysis-20261031":"f42de0d85b30d100c54a9656c59eeecc4b1b8444","feat/research-preparation":"c793a43264811c7f56d2911fed6945cc4cd1cbb1","feat/unified-research-runtime":"b5d02248a61a813ff6fdf5ff308b0c6de118ff85","feat/web-api":"af6dfb39d82c057190bc93cd543351765542f96d","feat/web-integration":"2323e50eb24c686fac23fa2a1093763d5b0c15ac","feat/web-ui-v1":"4b07199664c9616e16af6bb7e1c2a740686877c7","fix/agent-business-acceptance":"071278c45ad4d8b0a3a23448b3426e3a6e3b6314","fix/agent-reliability-trust":"09afa144e3d6eb7899fb741a77341417489298b9","fix/catalog-top-spacing-20261031":"01a8cdfae77b4cfe087b110b97ce221e3577e56c","fix/compare-natural-language-discovery-20261031":"ff1fbf5f000ecfc42240ca2f8705d265c9b34c7f","fix/compare-topic-relevance-20261031":"bef985027bae02b9f27d15397e11e2bf0b86657a","fix/qa-evidence-revision":"64f352aede2165741df68fbbde9914897af79c4e","fix/qa-literal-keyword-matching-20261031":"c34fd0c5977be5d7680668665e904c147aaa00c2","fix/qa-live-reliability":"be8ff74f96005ca0733ca5bddce9f19aace042fc","fix/qa-output-reliability-historical-plan":"2cbd07796d10f6922bed2397613ee874782d6aea","fix/qa-verification-reliability":"a137b59770d16f3fafe3b1eac86675b6cb74320a","fix/verified-report-and-plan-scope":"50788edc8668c173cd5b161026c13122ef97f1c5","fix/web-home-brand-scale":"4aacd9ead59a77ee225a8472c0ef7be51e94ed76","integration/pr35-main-20261101":"c76de277dd844884bae03b7fbee2f5ae0d4c4b80","style/remove-chat-speakers-and-shrink-qa-count-20261031":"bae9a19703ed8164f8e7a2aa8aa52e5c5e72eeee","style/sidebar-brand-match-topbar-20261031":"01c3c51b31eb5bf073438f0270675a9e57b746d1","style/streamline-qa-conversation-20261031":"711b9f917e91fa7e4394b32207f2913f6d8695d3","政策比较分析开发":"e6bc0eb0d8b34f476dd09f908335f4433d6d8f01"}
          repo = os.environ["GITHUB_REPOSITORY"]
          kept = {"main", "experiment/hyperresearch-mechanisms", "codex/guance-web-redesign", "feat/qa-multiturn-context", "feat/sidebar-icon-alignment"}
          deleted = []
          skipped = []
          subprocess.run(["git", "fetch", "--prune", "origin", "+refs/heads/*:refs/remotes/origin/*"], check=True)
          for branch, pinned_sha in expected.items():
              if branch in kept:
                  raise RuntimeError("Protected branch in deletion set: " + branch)
              found = subprocess.run(["git", "rev-parse", "--verify", "refs/remotes/origin/" + branch], capture_output=True, text=True)
              if found.returncode or found.stdout.strip() != pinned_sha:
                  skipped.append((branch, "branch moved or missing")); continue
              ancestry = subprocess.run(["git", "merge-base", "--is-ancestor", pinned_sha, "refs/remotes/origin/main"])
              if ancestry.returncode:
                  skipped.append((branch, "not merged into latest main")); continue
              endpoint = "repos/" + repo + "/git/refs/heads/" + urllib.parse.quote(branch, safe="/")
              resp = subprocess.run(["gh", "api", "-X", "DELETE", endpoint], capture_output=True, text=True)
              if resp.returncode:
                  skipped.append((branch, "GitHub API: " + resp.stderr.strip()[:200])); continue
              deleted.append(branch)
              print("DELETED", branch, flush=True)
          print("CLEANUP_SUMMARY", json.dumps({"deleted_count":len(deleted), "deleted":deleted, "skipped":skipped}, ensure_ascii=False), flush=True)
          if skipped: sys.exit(1)
          PY
