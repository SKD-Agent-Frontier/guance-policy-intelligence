name: Agent CI
on:
  push:
    paths: ['agent/**', 'rag库/检索工程/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['agent/**', 'rag库/检索工程/**', '.github/workflows/ci.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m ruff check .
  rag-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag库/检索工程
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pydantic>=2,<3' 'pytest>=8'
      - run: python -m pytest ci_tests -q
