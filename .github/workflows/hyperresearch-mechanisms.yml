name: Hyperresearch Mechanisms Experiment

on:
  push:
    branches: [experiment/hyperresearch-mechanisms]
    paths:
      - "agent/**"
      - ".github/workflows/hyperresearch-mechanisms.yml"
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/hyperresearch-mechanisms.yml"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_hyper_mechanisms.py
      - run: python -m pytest -q tests
      - run: python -m ruff check src/guance_agent/harness_inspired.py tests/test_hyper_mechanisms.py
