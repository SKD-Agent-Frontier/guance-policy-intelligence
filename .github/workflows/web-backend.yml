name: Web Backend CI

on:
  push:
    paths:
      - "web/backend/**"
      - ".github/workflows/web-backend.yml"
  pull_request:
    paths:
      - "web/backend/**"
      - ".github/workflows/web-backend.yml"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt -e "../../agent[dev]"
      - run: python -m pytest -q tests
      - run: python -m ruff check --config ../../agent/pyproject.toml app tests
      - name: Audit 506 clean policy bodies (read-only, advisory)
        run: python scripts/audit_policy_body_quality.py "../../语料库/Agent标准引用库"
